<app-header/>
<div class="p-10 pt-52 relative flex justify-center">
   <img src="/icons/Blue.svg" class="absolute top-0 left-0 -z-30 opacity-35" alt="">
   <img src="/icons/Rose.svg" class="absolute -z-30 bottom-0 right-0 opacity-35 rotate-180" alt="">
   <img src="/icons/Texture.svg" class="absolute left-0 opacity-10 -z-10 top-0 h-full w-full object-cover" alt="">

   <div class="bg-white border border-gray-200 rounded-xl shadow-lg w-full max-w-lg overflow-hidden">
        <!-- Error Icon Header -->
        <div class="bg-gradient-to-r from-red-500 to-rose-500 px-6 py-8 text-center">
            <div class="mx-auto w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4">

            </div>
            <h1 class="text-2xl font-bold text-white mb-2">Pago No Procesado</h1>
            <p class="text-red-100 text-sm">Tu transacción no pudo ser completada</p>
        </div>

        <!-- Content -->
        <div class="px-6 py-8">
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-3">
                    Lo sentimos, hubo un problema
                </h2>
                <p class="text-gray-600 leading-relaxed">
                    No pudimos procesar tu pago en este momento. Por favor, verifica tu información de pago e intenta nuevamente.
                </p>
            </div>


            <!-- Action Buttons -->
            <div class="m-auto flex justify-center">
                <a href="/" class="rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:ring-offset-2 border border-gray-200 bg-gray-50 hover:bg-gray-100 text-gray-900 py-3 px-5 flex items-center gap-2 cursor-pointer">
                   <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                  </svg> Inicio

            <div class="flex items-center justify-center text-sm text-gray-500">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192L5.636 18.364M12 2.25a9.75 9.75 0 109.75 9.75A9.75 9.75 0 0012 2.25z"></path>
                </svg>
                ¿Sigues teniendo problemas?
                <a href="#" class="text-red-600 hover:text-red-800 ml-1 font-medium">Contacta soporte</a>
            </div>
        </div>
</div>

</div>
<app-footer/>
